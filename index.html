<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#29b6f6">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%2329b6f6'/><text x='90' y='124' font-size='104' text-anchor='middle'>🎣</text></svg>">
  <title>歡樂釣魚大冒險 🎣</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <!-- Rainbow Fever Screen Neon Frame -->
    <div id="fever-border" class="fever-border hidden"></div>

    <!-- Main Ocean Canvas -->
    <canvas id="ocean-canvas"></canvas>

    <!-- Top Arcade HUD -->
    <header id="hud-top">
      <div class="hud-left">
        <!-- Player Rank Badge + Circular XP Ring + Stars -->
        <div class="rank-pill" id="rank-display" title="小小釣魚王等級">
          <div class="rank-avatar-wrap">
            <svg class="rank-xp-svg" viewBox="0 0 44 44">
              <circle class="xp-track" cx="22" cy="22" r="19"></circle>
              <circle class="xp-fill" id="rank-xp-ring" cx="22" cy="22" r="19"></circle>
            </svg>
            <span class="rank-icon" id="rank-icon">🫧</span>
          </div>
          <div class="rank-info">
            <div class="rank-title" id="rank-title">泡泡新手</div>
            <div class="rank-stars" id="star-display">
              <span>⭐</span><span id="star-count">0</span>
            </div>
          </div>
        </div>

        <!-- Live Catch Basket & Album Trigger -->
        <button class="arcade-btn basket-btn" id="btn-album" aria-label="今日魚籃與圖鑑">
          <span class="basket-icon">🪣</span>
          <div class="basket-fish-row" id="basket-fish-row">
            <span class="basket-empty-dot">🐠</span>
          </div>
          <span class="basket-count" id="album-progress">0/12</span>
        </button>
      </div>

      <div class="hud-center">
        <div id="fever-bar-wrap" class="fever-bar-wrap" title="彩虹派對能量">
          <span class="fever-icon">🌈</span>
          <div class="fever-track">
            <div id="fever-fill" class="fever-fill"></div>
          </div>
          <span id="fever-x2-tag" class="fever-x2-tag hidden">x2!</span>
        </div>
        <div class="hud-sub-row">
          <div id="quest-pill" class="quest-pill" title="釣 3 隻魚拿可愛海洋貼紙！">
            <span id="quest-dots">⚪⚪⚪</span>
            <span class="quest-gift">🎁</span>
          </div>
          <div id="combo-badge" class="combo-badge hidden">🔥 2 連釣！</div>
        </div>
      </div>

      <div class="hud-right">
        <!-- Live Motion Tilt Indicator (Visible when Motion Mode ON) -->
        <div id="motion-indicator" class="motion-indicator hidden" title="體感甩竿已開啟">
          <span id="motion-rod-icon" class="motion-rod-icon">🎣</span>
        </div>

        <!-- Parent Settings Button (Hold 1.2s to open - child proof!) -->
        <button class="arcade-btn parent-gear-btn" id="btn-parent-settings" title="長按開啟家長設定" aria-label="長按開啟家長設定">
          <svg class="hold-ring-svg" viewBox="0 0 52 52">
            <circle class="hold-ring-bg" cx="26" cy="26" r="22"></circle>
            <circle class="hold-ring-fill" id="parent-hold-ring" cx="26" cy="26" r="22"></circle>
          </svg>
          <span class="btn-icon">⚙️</span>
        </button>
      </div>
    </header>

    <!-- Dynamic Floating Event Banner (BITE! / BOSS! / FEVER! / RANK UP!) -->
    <div id="event-banner" class="event-banner hidden">
      <div class="banner-text" id="event-banner-text">咬鉤了！</div>
    </div>

    <!-- Idle Cast Controls: Stage Switcher + Bait Switcher + Rod Tag + Giant Pulsing Cast Button -->
    <div id="idle-controls" class="idle-controls">
      <div class="idle-left-stack">
        <div class="idle-btn-row">
          <button id="btn-stage-switch" class="arcade-btn stage-btn" aria-label="切換海洋地圖">
            <span id="stage-icon">🏝️</span>
            <span id="stage-name">陽光珊瑚海</span>
          </button>
          <button id="btn-bait-switch" class="arcade-btn bait-btn" aria-label="切換魚餌">
            <span id="bait-icon">🦐</span>
            <span id="bait-name">小蝦米</span>
          </button>
        </div>
        <div class="rod-tag" id="rod-tag">🪵 木頭小釣竿</div>
      </div>
      <button id="btn-big-cast" class="big-cast-btn" aria-label="拋竿釣魚">
        <span class="cast-btn-icon">🎣</span>
        <span class="cast-btn-label">拋竿！</span>
      </button>
    </div>

    <!-- Bottom Arcade Controls (Reeling & Zap!) -->
    <div id="arcade-controls" class="arcade-controls hidden">
      <!-- Upgraded Arcade Tug-of-War Progress Bar -->
      <div class="tug-bar-wrap">
        <div class="tug-track">
          <div id="reel-progress-fill" class="reel-progress-fill"></div>
          <div id="tug-fish-slider" class="tug-fish-slider">
            <span id="tug-fish-emoji">🐟</span>
            <span id="tug-status-fx" class="tug-status-fx">💦</span>
          </div>
        </div>
        <span class="reel-bucket-icon">🪣</span>
      </div>

      <div class="controls-row">
        <!-- Giant Electric Shock Button with Circular SVG Charge Ring -->
        <button id="btn-zap" class="zap-btn" aria-label="閃電必殺技">
          <svg class="zap-ring-svg" viewBox="0 0 132 132">
            <circle class="zap-ring-track" cx="66" cy="66" r="58"></circle>
            <circle class="zap-ring-progress" id="zap-ring-progress" cx="66" cy="66" r="58"></circle>
          </svg>
          <span class="zap-icon">⚡</span>
          <span class="zap-label">閃電！</span>
        </button>

        <!-- Giant Tactile Fishing Reel Crank with Dynamic Speed Tier Glow -->
        <div id="reel-crank-zone" class="reel-crank-zone speed-0" aria-label="轉動捲線器">
          <div class="reel-outer-ring">
            <div class="reel-arrows">↻</div>
            <div id="reel-wheel" class="reel-wheel">
              <div class="reel-spoke spoke-1"></div>
              <div class="reel-spoke spoke-2"></div>
              <div class="reel-center-cap">🎣</div>
              <div id="reel-knob" class="reel-knob"></div>
            </div>
          </div>
          <div class="reel-hint-tag" id="reel-speed-tag">轉轉轉！</div>
        </div>
      </div>
    </div>

    <!-- Big Catch Celebration Overlay -->
    <div id="catch-modal" class="modal-overlay hidden">
      <div class="catch-card">
        <div class="catch-stars" id="catch-stars">⭐⭐⭐</div>
        <div class="catch-badges-row">
          <div class="catch-badge hidden" id="catch-new-badge">✨ 新發現！</div>
          <div class="catch-badge record-badge hidden" id="catch-record-badge">🏆 破紀錄！</div>
        </div>
        <canvas id="catch-fish-canvas" width="260" height="200"></canvas>
        <h2 class="catch-title" id="catch-name">小丑魚</h2>
        <div class="catch-size-tag" id="catch-size-tag">📏 28 公分</div>
        <p class="catch-subtitle" id="catch-fun-line">好棒喔！</p>
        <div class="catch-reward">
          <span>+</span><span id="catch-reward-stars">10</span><span> ⭐</span>
        </div>
        <button id="btn-catch-ok" class="big-play-btn">繼續釣魚！🎣</button>
      </div>
    </div>

    <!-- Fish Album / Interactive Mini Aquarium Modal -->
    <div id="album-modal" class="modal-overlay hidden">
      <div class="album-card">
        <div class="album-header">
          <div class="album-tabs">
            <button id="tab-album-grid" class="album-tab-btn active">📖 海洋圖鑑</button>
            <button id="tab-aquarium" class="album-tab-btn">🐠 互動水族箱</button>
          </div>
          <button id="btn-album-close" class="arcade-btn close-btn" aria-label="關閉">✖</button>
        </div>
        <div id="sticker-shelf" class="sticker-shelf">
          <span class="sticker-label">🏅 海洋貼紙：</span>
          <div id="sticker-list" class="sticker-list"></div>
        </div>
        <div class="album-grid" id="album-grid"></div>
        <div id="aquarium-view" class="aquarium-view hidden">
          <canvas id="aquarium-canvas" width="600" height="360"></canvas>
          <p class="aquarium-tip">👆 點一下水族箱灑飼料，小魚會游過來吃喔！</p>
        </div>
      </div>
    </div>

    <!-- Parent Settings Modal (Child-Proof) -->
    <div id="parent-modal" class="modal-overlay hidden">
      <div class="parent-card">
        <div class="album-header">
          <h2>⚙️ 家長設定</h2>
          <button id="btn-parent-close" class="arcade-btn close-btn" aria-label="關閉">✖</button>
        </div>
        <p class="parent-tip">提示：長按右上角 ⚙️ 1 秒即可開啟此選單，避免小朋友誤觸。</p>
        <div class="parent-options">
          <button id="btn-toggle-sound" class="parent-opt-btn active">
            <span>🔊 電玩音效</span>
            <span class="opt-state">開啟</span>
          </button>
          <button id="btn-toggle-bgm" class="parent-opt-btn active">
            <span>🎵 歡樂海洋音樂</span>
            <span class="opt-state">開啟</span>
          </button>
          <button id="btn-toggle-voice" class="parent-opt-btn active">
            <span>🗣️ 中文語音鼓勵</span>
            <span class="opt-state">開啟</span>
          </button>
          <button id="btn-toggle-motion" class="parent-opt-btn">
            <span>📱 手機體感甩竿</span>
            <span class="opt-state">關閉</span>
          </button>
          <button id="btn-toggle-eyecare" class="parent-opt-btn">
            <span>⏰ 護眼休息計時</span>
            <span class="opt-state">關閉</span>
          </button>
          <button id="btn-reset-save" class="parent-opt-btn danger">
            <span>🗑️ 重置星星與圖鑑</span>
            <span class="opt-state">重置</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Goodnight Eye-Care Rest Overlay -->
    <div id="goodnight-modal" class="modal-overlay hidden">
      <div class="goodnight-card">
        <div class="goodnight-moon">🌙✨</div>
        <h2 class="goodnight-title">小魚要去睡覺囉！</h2>
        <p class="goodnight-desc">今天釣魚好棒喔！讓眼睛和海洋朋友一起休息一下吧 💤</p>
        <div class="goodnight-actions">
          <button id="btn-goodnight-more" class="parent-opt-btn active">
            <span>⏰ 家長允許：再玩 5 分鐘</span>
            <span class="opt-state">+5m</span>
          </button>
          <button id="btn-goodnight-close" class="parent-opt-btn">
            <span>✅ 關閉計時並繼續</span>
            <span class="opt-state">關閉</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Interactive Tap-to-Open Treasure Chest Overlay -->
    <div id="treasure-modal" class="modal-overlay hidden">
      <div class="treasure-card">
        <div class="treasure-hint" id="treasure-hint">點點寶箱打開它！</div>
        <button id="btn-treasure-tap" class="treasure-tap-btn" aria-label="點擊打開寶箱">
          <span id="treasure-emoji">🎁</span>
        </button>
        <div class="treasure-taps-left" id="treasure-taps-left">⚪ ⚪ ⚪</div>
      </div>
    </div>

    <!-- Welcome / Start Screen -->
    <div id="start-screen" class="start-screen">
      <div class="start-card">
        <div class="start-logo-wrap">
          <div class="start-fish-bounce">🐠</div>
          <div class="start-rod-wave">🎣</div>
        </div>
        <h1 class="start-title">歡樂釣魚大冒險</h1>
        <p class="start-desc">點水面或按大按鈕拋竿・轉轉捲線器・放閃電釣大魚！</p>
        <button id="btn-start-game" class="big-play-btn pulse-btn">
          <span>▶ 開始釣魚！</span>
        </button>
      </div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/fishData.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
